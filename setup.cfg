[metadata]
name = pyramid_oauthlib_lowlevel
version = attr: pyramid_oauthlib_lowlevel.__VERSION__
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/pyramid_oauthlib_lowlevel
description = lowlevel Pyramid implementation of oauthlib
long_description = file: README.md
long_description_content_type = text/markdown
keywords = web, pyramid, oauth, oauthlib
license = BSD
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=3.7
packages = find:
package_dir =
    = src
include_package_data = true
zip_safe = false
install_requires =
    oauthlib>=3.2.2
    pyramid
    requests_oauthlib>=2.0.0
    requests
    typing_extensions
    setuptools<82; python_version < "3.10"

[options.packages.find]
where = src

[options.package_data]
pyramid_oauthlib_lowlevel = py.typed

[options.extras_require]
testing =
    pyramid_formencode_classic>=0.10.0
    pyramid_mako
    pyramid_tm
    pytest
    responses
    sqlalchemy>2.0
    webtest
    zope.sqlalchemy

[tox:tox]
envlist = py{37,38,39,310,311,312,313,314,315}

[testenv]
package = wheel
extras = testing
deps = coverage
setenv = COVERAGE_FILE = {envtmpdir}/.coverage
commands =
    python --version
    coverage run -m pytest {posargs}
commands_post =
    coverage html -d {toxworkdir}/htmlcov-{envname}

[coverage:run]
source = pyramid_oauthlib_lowlevel

[flake8]
application_import_names = pyramid_oauthlib_lowlevel
import_order_style = appnexus

exclude = .eggs, .tox, build

# E501 line too long
# W503 line break before binary operator
ignore = E501,W503
per-file-ignores:
    src/pyramid_oauthlib_lowlevel/client/api_client.py: W503
    src/pyramid_oauthlib_lowlevel/oauth1/validator.py: W503
    