name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.7"
            toxenv: py37
            image: python:3.7.17-bullseye
          - python: "3.8"
            toxenv: py38
          - python: "3.9"
            toxenv: py39
          - python: "3.10"
            toxenv: py310
          - python: "3.11"
            toxenv: py311
          - python: "3.12"
            toxenv: py312
          - python: "3.13"
            toxenv: py313
          - python: "3.14"
            toxenv: py314
          - python: "3.15"
            toxenv: py315

    env:
      TOXENV: ${{ matrix.toxenv }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.image == ''
        with:
          python-version: ${{ matrix.python }}
      - name: Test with tox
        if: matrix.image == ''
        run: |
          python -m pip install 'tox>=4'
          python -m tox
      - name: Test in official Python container
        if: matrix.image != ''
        env:
          PYTHON_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env TOXENV --volume "$PWD:/project" \
            --workdir /project "$PYTHON_IMAGE" sh -ec '
              python -m venv /tmp/tox
              /tmp/tox/bin/python -m pip install "tox>=4"
              /tmp/tox/bin/python -m tox
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.toxenv }}
          path: .tox/htmlcov-${{ matrix.toxenv }}
          include-hidden-files: true
